<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
        <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f5964a"/>
            <stop offset="1" stop-color="#c45a0c"/>
        </linearGradient>
        <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#a84c08"/>
            <stop offset="1" stop-color="#7d3804"/>
        </linearGradient>
    </defs>
    <!-- an S made of two pieces, as in the other apps of SavOffice: the board with its dots and a line written by hand,
