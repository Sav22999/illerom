    <path d="M12 51.500h17" stroke="#ffd166" stroke-width="6" stroke-linecap="round"/>
    <defs><clipPath id="m"><rect x="7" y="-4.600" width="15" height="9.200" rx="2.400"/></clipPath></defs>
    <g transform="translate(31.500 50.800) rotate(-40)">
        <rect x="7.600" y="-3.400" width="15" height="9.200" rx="2.400" fill="#3d1a02" fill-opacity=".35"/>
        <path d="M.2-1.200 4.600-3v6L.2 1.400a1.300 1.300 0 0 1 0-2.600z" fill="#ffd166"/>
        <rect x="4.200" y="-3.500" width="3.600" height="7" rx="1" fill="#f1e2d3"/>
        <g clip-path="url(#m)">
            <rect x="7" y="-4.600" width="15" height="9.200" fill="#fff"/>
            <rect x="17" y="-4.600" width="6" height="9.200" fill="#ffd166"/>
            <rect x="7" y="2.400" width="16" height="2.200" fill="#7d3804" fill-opacity=".12"/>
            <rect x="9.500" y="-2.600" width="5.500" height="1.300" rx=".650" fill="#c45a0c" fill-opacity=".22"/>
