    <path d="M20.500 4H53a5 5 0 0 1 5 5v17.500a5 5 0 0 1-5 5H20.500A13.750 13.750 0 0 1 20.500 4z" fill="url(#a)"/>
    <g fill="#fff" fill-opacity=".45">
        <circle cx="19" cy="12" r="1.3"/><circle cx="27" cy="12" r="1.3"/><circle cx="35" cy="12" r="1.3"/><circle cx="43" cy="12" r="1.3"/><circle cx="51" cy="12" r="1.3"/>
        <circle cx="19" cy="24" r="1.3"/><circle cx="51" cy="24" r="1.3"/>
    </g>
    <path d="M18 21c3-6 6-6 7.500-1.500S31 25 33.500 19s6-5 7.500-1 5 4 9-2" fill="none" stroke="#fff" stroke-width="3.400" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M43.500 60H11a5 5 0 0 1-5-5V37.500a5 5 0 0 1 5-5h32.500a13.750 13.750 0 0 1 0 27.500z" fill="url(#b)"/>
